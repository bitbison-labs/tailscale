# tailscaled's release packaging under Bitbison capture. The action's pre
# hook starts a whole-job capture before the steps below run; post seals it
# and submits the build.
#
# Scoped to tailscaled for now, two jobs:
#
#   tailscaled: `./tool/go run ./cmd/dist build` for the linux/amd64 tgz,
#     deb and rpm, which is how the public release tooling packages
#     tailscale + tailscaled (nfpm in-process), with the web client built
#     from client/web by tool/yarn rather than taken from the prebuilt
#     module.
#   images: the `client` image (tailscale, tailscaled, containerboot) with
#     build_docker.sh (mkctr) for linux/amd64, then the Dockerfile image,
#     both pushed to ghcr.io under this repository's owner. mkctr publishes
#     with go-containerregistry, the Dockerfile path with docker: two push
#     paths to one registry, both authenticated by the job's GITHUB_TOKEN
#     through `docker login` (mkctr reads the same credential store).
#     Each push step declares what it pushed (`buildguard artifact
#     --image`): mkctr's command line is too long for the capture to keep
#     its tags, so the declaration is what names the image.
#
# The other target families (other arches, Synology, QNAP) and the other
# images (k8s-operator, k8s-nameserver, tsidp, k8s-proxy) are left out
# until the integration is extended to them.
#
# The go caches, TMPDIR and ~/.cache (the toolchain, node and yarn the
# tool/ wrappers download) live on the runner's second disk: a first attempt
# that built everything filled the root filesystem and took the runner
# worker down with it, before the post hook could seal the capture.
#
# Full-history checkout: mkversion stamps the version from git. No
# gomodcache/go-build cache restore: the toolchain, modules, node and yarn
# all arrive over the network, the cold baseline.
name: bitbison

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tailscaled:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: bitbison-labs/github@master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}
          label: tailscaled/linux-amd64

      - name: scratch on the second disk
        run: |
          set -e
          base=/mnt/scratch
          if ! (sudo mkdir -p "$base" && sudo chown "$(id -u):$(id -g)" "$base"); then
            base="$RUNNER_TEMP/scratch"
            mkdir -p "$base"
          fi
          mkdir -p "$base/gocache" "$base/gomodcache" "$base/tmp" "$base/cache"
          {
            echo "GOCACHE=$base/gocache"
            echo "GOMODCACHE=$base/gomodcache"
            echo "TMPDIR=$base/tmp"
          } >> "$GITHUB_ENV"
          if [ -d "$HOME/.cache" ] && [ ! -L "$HOME/.cache" ]; then
            cp -a "$HOME/.cache/." "$base/cache/"
            rm -rf "$HOME/.cache"
          fi
          ln -sfn "$base/cache" "$HOME/.cache"
          df -h / "$base"

      # NOBASHDEBUG: under CI=true the tool/go wrapper traces itself with
      # `set -x`, and dist captures `go list`'s stderr together with its
      # stdout when it asks for a package directory; the trace ends up inside
      # the path. Tailscale's own CI sets the same variable.
      - name: tailscaled packages (linux/amd64)
        run: ./tool/go run ./cmd/dist build --verbose --web-client-root client/web --manifest dist/manifest.txt 'linux/amd64/(tgz|deb|rpm)'
        env:
          NOBASHDEBUG: "true"

      - name: built artifacts
        if: always()
        run: |
          cat dist/manifest.txt || true
          ls -la dist || true
          df -h / /mnt || true

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: bitbison-labs/github@master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}
          label: tailscaled/images

      - name: scratch on the second disk
        run: |
          set -e
          base=/mnt/scratch
          if ! (sudo mkdir -p "$base" && sudo chown "$(id -u):$(id -g)" "$base"); then
            base="$RUNNER_TEMP/scratch"
            mkdir -p "$base"
          fi
          mkdir -p "$base/gocache" "$base/gomodcache" "$base/tmp" "$base/cache"
          {
            echo "GOCACHE=$base/gocache"
            echo "GOMODCACHE=$base/gomodcache"
            echo "TMPDIR=$base/tmp"
          } >> "$GITHUB_ENV"
          if [ -d "$HOME/.cache" ] && [ ! -L "$HOME/.cache" ]; then
            cp -a "$HOME/.cache/." "$base/cache/"
            rm -rf "$HOME/.cache"
          fi
          ln -sfn "$base/cache" "$HOME/.cache"
          df -h / "$base"

      - name: login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # build_docker.sh tags v<short> and v<minor>, from the same version
      # variables it reads.
      - name: tailscale image (mkctr, linux/amd64)
        run: |
          repo=ghcr.io/${{ github.repository_owner }}/tailscale
          TARGET=client PLATFORM=flyio REPOS="$repo" PUSH=true ./build_docker.sh
          eval "$(./build_dist.sh shellvars)"
          command -v buildguard >/dev/null && buildguard artifact --image "$repo:v${VERSION_SHORT}" --image "$repo:v${VERSION_MINOR}" || true

      - name: tailscale image (Dockerfile)
        run: |
          ref=ghcr.io/${{ github.repository_owner }}/tailscale-dockerfile:${GITHUB_SHA::9}
          docker build -t "$ref" .
          docker push "$ref"
          command -v buildguard >/dev/null && buildguard artifact --image "$ref" || true
          df -h / /mnt
